name: checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: cli

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run fmt:check
      - run: bun run test

  # Runs the action with the nik release that cli/package.json names, not this branch's nik.
  # Not on main: the release commit lands there before release.yml uploads its binaries.
  action:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck action/*.sh
        working-directory: .
      - uses: ./
        with:
          mode: scan
          path: cli/testdata/benign-skills

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check title
        working-directory: .
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: [^A-Z].*$'
          [[ $TITLE =~ $re ]] && exit 0
          escaped=${TITLE//%/%25}
          escaped=${escaped//$'\r'/%0D}
          escaped=${escaped//$'\n'/%0A}
          echo "::error::PR title \"$escaped\" must be \"type: subject\" or \"type(scope): subject\", where type is feat, fix, docs, style, refactor, perf, test, build, ci, chore, or revert, and the subject does not start with an uppercase letter."
          exit 1
